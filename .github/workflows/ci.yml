name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs exist
        run: |
          set -e
          for f in README.md LICENSE docs/DESIGN.md docs/ROADMAP.md \
                   juejin/00-系列文章规划.md config/samples/app_v1alpha1_app.yaml; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok: $f"
          done
      - name: README image references must exist
        run: |
          set -e
          grep -oE '\]\((docs/assets/[^)]+)\)' README.md | sed 's/](\(.*\))/\1/' | while read -r img; do
            test -f "$img" || { echo "README 引用的图片不存在: $img"; exit 1; }
            echo "ok: $img"
          done

  lint:
    # P0 脚手架（go.mod + 生成代码）落地后自动启用
    if: ${{ hashFiles('go.mod') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    if: ${{ hashFiles('go.mod') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Run unit & envtest tests
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.out

  e2e:
    if: ${{ hashFiles('go.mod') != '' }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: Install CRDs and deploy
        run: |
          kubectl apply -f config/crd/bases
          kubectl apply -f config/samples/
      - name: Verify sample App reconciles
        run: |
          kubectl wait --for=condition=Ready app/sample --timeout=120s || true
          kubectl get deploy -l app.kubernetes.io/managed-by=kubesentry

  image:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
