name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION_FILE: go.mod

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs exist
        run: |
          set -e
          for f in README.md LICENSE docs/DESIGN.md docs/ROADMAP.md docs/STATUS.md \
                   juejin/00-系列文章规划.md config/samples/app_v1alpha1_app.yaml; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok: $f"
          done
      - name: README image references must exist
        run: |
          set -e
          grep -oE '\]\((docs/assets/[^)]+)\)' README.md | sed 's/](\(.*\))/\1/' | while read -r img; do
            test -f "$img" || { echo "README 引用的图片不存在: $img"; exit 1; }
            echo "ok: $img"
          done
      - name: 文档一致性（用例数单一事实源 / 已完成项不得仍标计划中）
        # 起因：README 徽章 139、同文件开发节 113、DESIGN 里 envtest 还写"计划中"。
        # 一个主打"文档即账本"的项目，账本自己对不上是硬伤；人工核对漏过一次，改机器查。
        run: python3 hack/doc_consistency.py

  # 校验代码可编译、可格式、可测试。
  # 注意：条件判断必须写在 step 级——写在 job 级 if 里的非法表达式会让整份 workflow 校验失败，
  # 连 job 都不会被创建（历史教训：本仓库 badge 曾因此红了整个建仓期）。
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./api ./cmd ./internal ./pkg ./test)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: go test -race
        # 数据竞争不崩溃、不报错，只在特定并发时序下悄悄算错数
        # （实例：Decide() 曾有的 e.nowFunc = nowFn，当时只因默认并发=1 才没炸）。
        # ubuntu runner 有 gcc；本机 Windows 没有——本地跑不了 ≠ 不用跑。
        run: go test -race -count=1 ./internal/... ./pkg/...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.out

  # 控制循环级集成测试：进程内起真实 etcd + kube-apiserver，
  # 验 watch → enqueue → Reconcile → status 回写 的完整闭环（创建/漂移/删除/就绪）。
  # KUBESTASIS_REQUIRE_ENVTEST=1：二进制装不上必须红，不允许静默跳绿。
  envtest:
    name: envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: 安装 envtest 二进制（K8s 1.31.x，对齐 go.mod 的 client-go 0.31）
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.31.x -p path)" >> "$GITHUB_ENV"
      - name: go test ./test/envtest
        env:
          KUBESTASIS_REQUIRE_ENVTEST: "1"
        run: go test ./test/envtest/... -v -count=1

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Build images
        run: |
          docker build -t kubestasis:e2e .
          # P2 自愈回归要两个镜像版本：v1 正常 / v2-crash 启动即退出，
          # 回滚的语义就是"把 spec.image 退回上一个不同镜像"
          docker build -t kubestasis-demoapp:v1 -f deploy/demoapp/Dockerfile .
          docker build -t kubestasis-demoapp:v2-crash -f deploy/demoapp/Dockerfile.crash \
            --build-arg DEMOAPP_IMAGE=kubestasis-demoapp:v1 .
      - name: Load images into kind
        run: kind load docker-image kubestasis:e2e kubestasis-demoapp:v1 kubestasis-demoapp:v2-crash --name kind
      - name: Deploy operator with admission webhook
        # deploy-webhook = overlay 部署 + 自签证书 + caBundle 注入 + 滚动重启，
        # 不依赖 cert-manager；P3 的 Webhook 与 P0 链路在同一集群里验证
        run: make deploy-webhook IMG=kubestasis:e2e
      - name: Webhook rejects :latest image
        run: |
          set -e
          cat > /tmp/bad-app.yaml <<'EOF'
          apiVersion: kubestasis.io/v1alpha1
          kind: App
          metadata:
            name: bad-latest
          spec:
            image: nginx:latest
            port: 8080
          EOF
          # rollout 完成 ≠ webhook 已可服务（endpoint 就绪与证书挂载有秒级延迟），
          # 对"还没就绪"的 InternalError 重试；只有拿到明确的 Forbidden 才算数
          ok=""
          for i in $(seq 1 12); do
            if kubectl apply -f /tmp/bad-app.yaml 2>/tmp/webhook-err.txt; then
              echo "FAIL: webhook accepted a :latest image"
              exit 1
            fi
            if grep -q "Forbidden" /tmp/webhook-err.txt; then ok=yes; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "webhook never became ready:"; cat /tmp/webhook-err.txt; exit 1; }
          grep -i "latest" /tmp/webhook-err.txt || { cat /tmp/webhook-err.txt; exit 1; }
          echo "ok: rejected with: $(tail -1 /tmp/webhook-err.txt)"
      - name: Webhook defaults replicas from minReplicas
        run: |
          set -e
          cat > /tmp/defaulted-app.yaml <<'EOF'
          apiVersion: kubestasis.io/v1alpha1
          kind: App
          metadata:
            name: defaulted
          spec:
            image: kubestasis-demoapp:v1
            port: 8080
            scaling:
              minReplicas: 3
              maxReplicas: 5
          EOF
          kubectl apply -f /tmp/defaulted-app.yaml
          got=$(kubectl get app defaulted -o jsonpath='{.spec.replicas}')
          [ "$got" = "3" ] || { echo "FAIL: replicas=$got, want 3 (from minReplicas)"; exit 1; }
          echo "ok: replicas defaulted to minReplicas=3"
      - name: Apply sample App
        run: kubectl apply -f config/samples/
      - name: Assert App becomes Available
        run: |
          set -e
          kubectl wait --for=condition=Available app/sample --timeout=240s
          kubectl get app sample -o wide
          kubectl get deploy,svc -l app.kubernetes.io/managed-by=kubestasis
          echo "--- status ---"
          kubectl get app sample -o jsonpath='{.status}'
          echo
      - name: Events must be recorded
        run: kubectl get events --field-selector reason=KubeStasisReconcile

      # ---------- P2 自愈回归（11.03 评审意见①：自愈不能只靠人工实测） ----------
      - name: P2 self-healing regression
        run: |
          set -e
          cat > /tmp/heal-demo.yaml <<'EOF'
          apiVersion: kubestasis.io/v1alpha1
          kind: App
          metadata:
            name: heal-demo
          spec:
            image: kubestasis-demoapp:v1
            replicas: 1
            port: 8080
            health:
              strategy: graduated
          EOF
          kubectl apply -f /tmp/heal-demo.yaml
          kubectl wait --for=condition=Available app/heal-demo --timeout=240s

          echo "==> 发布 crash 版本，期望：L2 摘除 → 复发 → 冷却期内升级 L3 → 回滚镜像"
          kubectl patch app heal-demo --type=merge -p '{"spec":{"image":"kubestasis-demoapp:v2-crash"}}'

          rolled_back=""
          # 探测周期 1-2min + 升级路径（冷却期默认 3min 内复发才升级）→ 预算 10 分钟
          for i in $(seq 1 60); do
            img=$(kubectl get app heal-demo -o jsonpath='{.spec.image}')
            if [ "$img" = "kubestasis-demoapp:v1" ]; then
              rolled_back="yes"; echo "==> L3 回滚生效（第 ${i}0 秒左右）"; break
            fi
            sleep 10
          done
          kubectl get app heal-demo -o jsonpath='{.status}' && echo
          kubectl get events --field-selector reason=KubeStasisHealAction
          if [ -z "$rolled_back" ]; then
            echo "FAIL: 10 分钟内没有等到自动回滚"
            exit 1
          fi
          # 防乒乓回归（本轮 CI 实测翻车修复）：回滚后继续盯 3 分钟，
          # image 必须停在 v1——旧 RS 的 crash Pod 未清完时不得把坏版本滚回来
          for j in $(seq 1 18); do
            img=$(kubectl get app heal-demo -o jsonpath='{.spec.image}')
            if [ "$img" != "kubestasis-demoapp:v1" ]; then
              echo "FAIL: 回滚后乒乓回 $img"
              exit 1
            fi
            sleep 10
          done
          kubectl wait --for=condition=Available app/heal-demo --timeout=240s
          echo "==> 自愈完成：回滚后恢复 Available 且未乒乓"
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n kubestasis-system logs deploy/kubestasis-controller-manager --tail=150
          kubectl describe app sample || true
          kubectl describe app heal-demo || true
          kubectl get events --sort-by=.lastTimestamp | tail -40

  # Helm Chart 的有效性：lint + 两种形态渲染 + CRD 副本一致性。
  # 不需要集群：template 会在本地把 chart 渲染成 YAML，值/默认值写错会直接报错。
  chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint charts/kubestasis
      - name: 渲染两种形态（webhook 关/开）
        run: |
          set -e
          helm template ks charts/kubestasis -n kubestasis-system > /tmp/default.yaml
          helm template ks charts/kubestasis -n kubestasis-system \
            --set webhook.enabled=true > /tmp/webhook.yaml
          grep -q 'kind: Deployment' /tmp/default.yaml
          grep -q 'kind: ValidatingWebhookConfiguration' /tmp/webhook.yaml
          echo "rendered: $(grep -c '^kind:' /tmp/default.yaml) + $(grep -c '^kind:' /tmp/webhook.yaml) objects"
      - name: Chart 里的 CRD 必须与 controller-gen 产物一致
        run: |
          # 忘了同步这份副本的后果：helm 装出来的 CRD 少字段，
          # 新功能"配了但不生效"，且本地 kustomize 安装看起来完全正常
          diff -u config/crd/bases/kubestasis.io_apps.yaml \
                  charts/kubestasis/crds/kubestasis.io_apps.yaml

  image:
    name: image
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless 签名要拿 OIDC token（Fulcio 证书的"身份来源"）
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        # 签 digest 不签 tag：tag 可以被重新指向，digest 不可变。
        # keyless 链：GitHub OIDC token → Fulcio 短期证书 → Rekor 透明日志，
        # 验证方用 issuer+subject 断言"这镜像是这个仓库的 CI 签的"，无需管理私钥。
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      - name: Verify signature round-trip
        # 签完立刻自验一遍：CI 里的证据链闭环，也防止签名步骤静默坏掉
        run: |
          cosign verify ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yml" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" | head -5
