apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubestasis.fullname" . }}
  namespace: {{ include "kubestasis.namespace" . }}
  labels:
    control-plane: controller-manager
    {{- include "kubestasis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubestasis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubestasis.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if eq (include "kubestasis.selfSignedCerts" .) "true" }}
        # 自签证书每次 helm upgrade 都会重签，这里挂一个 checksum：
        # 证书一变就触发滚动重启，否则旧 Pod 还拿着旧证书、caBundle 却是新的，
        # 所有 App 的创建/更新都会在准入阶段失败（failurePolicy=Fail）。
        checksum/webhook-cert: {{ include (print $.Template.BasePath "/webhook.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kubestasis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "kubestasis.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/kubestasis"]
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            {{- if .Values.prometheus.url }}
            - --prometheus-url={{ .Values.prometheus.url }}
            - --prometheus-window={{ .Values.prometheus.window }}
            {{- end }}
            - --heal-cooldown={{ .Values.healCooldown }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhook=true
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-cert
          secret:
            secretName: {{ include "kubestasis.fullname" . }}-webhook-cert
            defaultMode: 420
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
