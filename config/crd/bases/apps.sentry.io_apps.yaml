---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: apps.apps.sentry.io
spec:
  group: apps.sentry.io
  names:
    kind: App
    listKind: AppList
    plural: apps
    shortNames:
    - app
    singular: app
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentReplicas
      name: Ready
      type: integer
    - jsonPath: .status.desiredReplicas
      name: Desired
      type: integer
    - jsonPath: .spec.image
      name: Image
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: App is the Schema for the apps API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AppSpec defines the desired state of App.
            properties:
              health:
                description: Health 健康与自愈策略。可省略：省略时不做自愈。指针原因同上。
                properties:
                  canary:
                    description: CanaryPolicy 金丝雀发布观察策略.
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      errorRateThreshold:
                        default: "0.01"
                        description: ErrorRateThreshold 观察窗口内错误率超过该阈值则自动回滚，如 "0.01".
                        type: string
                      observationSeconds:
                        default: 300
                        description: ObservationSeconds 新版本发布后的观察窗口时长.
                        type: integer
                    required:
                    - enabled
                    - errorRateThreshold
                    - observationSeconds
                    type: object
                  restartThreshold:
                    default: 5
                    description: |-
                      RestartThreshold 单容器重启次数达到该值即视为异常信号（兜底识别路径，
                      主要识别仍靠 waiting.reason / lastState.terminated.reason）。
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  scaleUpPercent:
                    default: 20
                    description: |-
                      ScaleUpPercent L1 自愈扩容比例（当前副本数的百分比，至少 +1），
                      受 scaling.maxReplicas 钳制。
                    maximum: 100
                    minimum: 1
                    type: integer
                  strategy:
                    default: graduated
                    description: 'Strategy graduated: 分级自愈; observability-only: 只记录事件不动作.'
                    enum:
                    - graduated
                    - observability-only
                    type: string
                required:
                - strategy
                type: object
              image:
                description: Image 容器镜像，禁止 latest（Validating Webhook 强制）.
                minLength: 1
                type: string
              port:
                default: 8080
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                description: |-
                  Replicas 期望副本数。故意**不**给 CRD 默认值：CRD 默认值在解码阶段
                  （Mutating Webhook 之前）就会落进对象，若此处 default=1，webhook 的
                  "replicas 跟随 scaling.minReplicas" 跨字段默认将永远被抢先填 1 而失效
                  （11.03 真集群实测确认此顺序）。省略时的兜底：webhook 模式由
                  Defaulter 注入（跟随 minReplicas）；无 webhook 模式由控制器按 1 处理。
                format: int32
                minimum: 0
                type: integer
              scaling:
                description: |-
                  Scaling 伸缩策略。可省略：省略时不做伸缩决策。
                  必须是指针：omitempty 对结构体不生效，值类型会把省略的字段
                  序列化成零值对象（minReplicas=0 等），被 CRD 校验拒绝。
                properties:
                  cooldownSeconds:
                    default: 120
                    description: CooldownSeconds 冷却窗口：窗口内的缩容请求一律拒绝（扩容可紧急放行）.
                    minimum: 0
                    type: integer
                  errorRateScaleUpPercent:
                    default: 20
                    description: |-
                      ErrorRateScaleUpPercent 错误率超阈值时的单次扩容比例。
                      错误率无法换算成副本数，只能按比例吸收；连续超阈值会在多轮 Reconcile 里持续扩。
                    maximum: 100
                    minimum: 1
                    type: integer
                  hysteresisPercent:
                    default: 10
                    description: HysteresisPercent 迟滞带：期望副本与当前副本差值 ≤ max(1, current×p%)
                      时不动作。
                    maximum: 50
                    minimum: 0
                    type: integer
                  maxReplicas:
                    default: 3
                    format: int32
                    minimum: 1
                    type: integer
                  metrics:
                    description: |-
                      Metrics 伸缩信号列表，决策时取各信号计算结果的最大值.
                      可省略：未配置指标时伸缩引擎保持休眠（P1 接入 Prometheus 后才有意义）.
                    items:
                      description: MetricTarget 描述一个伸缩信号及其目标值.
                      properties:
                        target:
                          description: |-
                            Target 目标值，格式随 Type 而定：
                              QPS:        "1000"   (每 Pod 每秒请求数)
                              P99Latency: "200ms"
                              ErrorRate:  "0.01"   (1%)
                          minLength: 1
                          type: string
                        type:
                          description: Type 指标类型：QPS / P99Latency / ErrorRate
                          enum:
                          - QPS
                          - P99Latency
                          - ErrorRate
                          type: string
                      required:
                      - target
                      - type
                      type: object
                    maxItems: 5
                    minItems: 1
                    type: array
                  minReplicas:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  scaleDownStepPercent:
                    default: 20
                    description: |-
                      ScaleDownStepPercent 缩容单步最大比例（当前副本数的百分比，至少缩 1 个）。
                      扩容不受此限：扩容是应急动作，一步到位；缩容必须渐进，避免震荡。
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - cooldownSeconds
                - maxReplicas
                - minReplicas
                type: object
            required:
            - image
            - port
            type: object
          status:
            description: AppStatus defines the observed state of App.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentImage:
                description: CurrentImage 上一次 Reconcile 观察到的镜像，用于检测"镜像刚变更".
                type: string
              currentReplicas:
                description: |-
                  CurrentReplicas **就绪副本数**，取自 Deployment.status.readyReplicas。
                  注意：这是观测值，不是 spec.replicas；两者不一致时才说明还在收敛。
                format: int32
                type: integer
              desiredReplicas:
                description: DesiredReplicas spec 声明的期望副本数，方便与 CurrentReplicas 对比排障.
                format: int32
                type: integer
              lastHealAction:
                description: LastHealAction 最近一次自愈动作描述.
                type: string
              lastHealAt:
                description: LastHealAt 最近一次自愈动作时间，自愈冷却（观察期）的判断依据.
                format: date-time
                type: string
              lastHealLevel:
                description: |-
                  LastHealLevel 最近一次自愈动作的等级（0=L1 扩容, 1=L2 摘除, 2=L3 回滚），
                  升级路径的判断依据：冷却期内故障再现时升到下一级.
                type: integer
              lastImageChangeAt:
                description: LastImageChangeAt 上一次镜像变更时间，金丝雀观察窗口的起点.
                format: date-time
                type: string
              lastScalingAt:
                description: LastScalingAt 上一次伸缩动作时间，冷却窗口的判断依据.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration 本状态对应的 spec 版本，用于判断状态是否已过期.
                format: int64
                type: integer
              phase:
                default: Provisioning
                description: Phase 当前阶段.
                enum:
                - Provisioning
                - Stable
                - Healing
                - RollingBack
                type: string
              rollbackRevision:
                description: RollbackRevision 若发生过回滚，记录回滚到的版本.
                format: int64
                type: integer
            required:
            - phase
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
