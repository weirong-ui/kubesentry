apiVersion: v1
kind: Service
metadata:
  # kustomize namePrefix 会改成 kubestasis-webhook-service，
  # 与 hack/webhook-certs.sh 默认的证书 CN/SAN 一致
  name: webhook-service
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kubestasis
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
  selector:
    control-plane: controller-manager
