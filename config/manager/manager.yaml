apiVersion: v1
kind: Namespace
metadata:
  name: kubesentry-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kubesentry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentry-controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kubesentry
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: kubesentry-controller-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: IMG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command:
            - /kubesentry
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            # 启用伸缩（P1）：指向集群内 Prometheus。
            # 不配则伸缩引擎休眠，其余功能不受影响；指标名不匹配时用
            # PROMETHEUS_URL 环境变量或改 internal/scaler/prometheus.go 的默认模板。
            # - --prometheus-url=http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
